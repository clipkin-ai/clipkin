[project]
name = "clipkin-whisperx-service"
version = "0.1.0"
description = "Warm, loopback-only WhisperX alignment service for the Reel local Provider"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Proprietary; see LICENSE at the repository root" }
dependencies = [
  "numpy>=2.1,<3",
  "whisperx==3.8.6",
]

[project.scripts]
clipkin-whisperx-service = "clipkin_whisperx_service.__main__:main"
clipkin-whisperx-check = "clipkin_whisperx_service.check:main"
clipkin-whisperx-prepare = "clipkin_whisperx_service.prepare:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
# Rebuild this small service wheel when its packaged Python implementation changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
